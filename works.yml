mivg:
  type: chapter
  title: Music in Video Games
  author: Munday, Rod
  date: 2007
  publisher:
    name: Edinburgh University Press
    location: Edinburgh
  page-range: 51-67
  parent:
    title: "Music, Sound and Multimedia: From the Live to the Virtual"
    editor: Sexton, Jamie
  note: "This secondary source explores how music in video games is used to convey meaning.
    In particular, it has subheadings which explore how music conveys the gameworld 
    how music conveys narrative, both of which are directly relevant to the arguments
    we anticipate making. This source exists as part of a \"Video-Game Music\" section
    in a book, so the other chapters in the section may or may not also have
    useful information."

hsw:
  type: chapter
  title: "Hearing Storyworlds: How Video Games Use Sound to Convey Narrative"
  author: Domsch, Sebastian
  date: 2016
  page-range: 185-198
  parent:
    title: "Audionarratology: Interfaces of Sound and Narrative"
    editor: ["Mildorf, Jarmila", "Kinzel, Till"]
    publisher:
      name: De Gruyter
  note: "This secondary source is a chapter from a book on sound and its use to convey narratives.
    This chapter specifically deals with how videos games convey narratives with music.
    In particular, it discusses how diegetic music in video games is used to create 
    an immersive gameworld and give meaning to the virtualized environment."

vmo:
  type: thesis
  title: "The Virtual-Musical Other: Creating Unique Worlds Through Musical Sound in Videogames"
  author: French, Jeremiah Sundance
  date: 2014-05
  organization: University of Hawai'i at Manoa
  publisher: University of Hawai'i at Manoa
  note: "This secondary source is a masters thesis from the Univeristy of Hawai'i (their spelling).
    Although potentially less reliable, it seems especially relevant to our topic.
    It focuses on musical approaches in several post-apocalytic video games.
    It looks at how pre-existing music is recontextualized into a futuristic context
    and the ways in which that conveys narrative. It examines both diegetic and extra-diegetic music."

sn:
  type: article
  title: "Stray Notes: Yann van der Cruyssen on composing soundscapes beyond human trespass"
  url: "https://www.lacedrecords.com/blogs/blog/stray-notes-yann-van-der-cruyssen-on-composing-soundscapes-beyond-human-trespass"
  author: Jeriaska, Jerry
  publisher: Laced Records
  date: 2023-01-12
  parent:
    type: blog
    title: The Ongaku
  note: "This article is a summary of an interview with Yann Van der Cruyssen, the
  composer of all of the music from Stray. The interview was held by a writer for
  the Ongaku, a small multimedia outlet for videogame music news. It is unclear if
  a recording of the original interview exists, so the reliability of this source is
  somewhat questionble, as there is little context to many of the quotes. However, this
  will likely be our only primary source, as the composer doesn't seem to have been featured
  in many interviews other than this one. Van der
  Cruyssen, in this interview, summarizes his creative process for designing the music
  in the game. He specifically notes the music played by the guitarist (and possible
  self-insert) Morusque, which is directly relavent to our focus on the use of diegetic
  music in Stray. He also comments on his use of the traditional/robotic duality in music,
  another feature which is highly relavent to our thesis."
 
avsd:
  type: article
  author: ["Kafili, Dorsa", "Brennan, AnnMarie"]
  title: "Architectonics of Videogame Sound Design: The Use of Sound and Music in Creating Immersive Virtual Spaces"
  page-range: 439-466
  date: 2024
  serial-number:
    doi: "10.1080/20507828.2025.2530892"
  parent:
    type: periodical
    title: Architecture and Culture
    volume: 12
    issue: 3-4
    publisher:
      name: Routledge
  note: "This secondary source was written by a PhD candidate at University of Melbourne,
  along with a senior professor from the same school. While the author's field of study
  appears to be primarily concerned with architecture, both appear credentialed and familiar
  with gaming and game design. The paper was published in a reputable architecture journal.
  Kafili and Brennan explore how sound design and music play a significant role in how the
  player understands the space that they inhabit. Several games, including Stray, are mentioned
  as case studies for how games use sound design for conveying that a game takes place in a
  space with an atmosphere with organic and synthetic components. This article will be useful
  as a reference for the techniques that Stray uses to set the tone throughout the game, as
  well as techniques that games in general use to create atmosphere."

sdam:
  type: article
  author: Luersen, Eduardo
  title: "Sound Design and Audiovisual Memory in the Instantiation of Digital Game Worlds: An Essay on Iconophonics"
  date: 2024
  parent:
    type: periodical
    title: Syn-Thèses
    issue: 15
    publisher:
      name: School of French at Aristotle University of Thessaloniki  
  serial-number:
    doi: "10.26262/st.v0i15.10095"
  note: "This secondary source was written by a art professor at the University of Konstanz.
  Luersen discusses how sound design in games is often reflective of the surrounding musical
  culture. Game composers use 'technocultural' motifs to convey more complex themes that
  the listener/player is already familiar with from a larger cultural context. Game designers
  use these auido effects as shorthand to call upon certain aesthetic ideas. This source might
  be useful for exploring how some techniques that Stray uses act as shorthand for calling to
  mind concepts that the listener associates with 'robotic' or 'organic'."

cld:
  type: article
  author: Evans, Monica
  title: "Cozy Little Dystopias: Cyberpunk Mechanics, Aesthetics and Themes in Independent Digital Games"
  volume: 53
  issue: 148
  page-range: 39-57
  date: 2024
  parent:
    type: periodical
    title: Dagenham
    publisher:
      name: University of Texas at Dallas

wibh:
  type: thesis
  author: O'Brien, Rebecca Ann
  title: "When the Inhuman Becomes Human: An Examination of the Musical Portrayal of the Robot in Twenty-First Century Science-Fiction Cinema Through an Analysis of the Film Scores of Automata, Ex Machina, and The Machine"
  date: 2019
  organization: University of Kentucky, College of the Fine Arts, Department of Music
  page-range: 5-18, 106-111
  note: "This source discusses the musical themes of humanlike robots in science fiction film.
  There is a lot here, and I don't know how much will be relevant, but I expect it to be a somewhat useful resource."